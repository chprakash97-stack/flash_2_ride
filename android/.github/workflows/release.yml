name: Build and Release APK

on:
  push:
    branches:
      - main # మీ main/master branch కి push చేసినప్పుడు ట్రిగ్గర్ అవుతుంది

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Code ని checkout చేయడం
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java environment సెటప్
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Flutter SDK సెటప్
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 4. Dependencies ఇన్‌స్టాల్ చేయడం
      - name: Install dependencies
        run: flutter pub get

      # 5. Release APK Build చేయడం
      - name: Build Release APK
        run: flutter build apk --release

      # 6. GitHub Release క్రియేట్ చేసి APK ని అప్‌లోడ్ చేయడం
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          body: "Automated APK build from push."