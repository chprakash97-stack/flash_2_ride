name: Build and Release APK

on:
  push:
    branches:
      - main
      - master

# ఈ permissions సెక్షన్ తప్పనిసరి
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Code Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 4. Install Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Decode Keystore & Configure key.properties from GitHub Secrets
      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          echo "storePassword='${{ secrets.KEY_PASSWORD }}'" >> android/key.properties
          echo "keyPassword='${{ secrets.KEY_PASSWORD }}'" >> android/key.properties
          echo "keyAlias='${{ secrets.ALIAS_NAME }}'" >> android/key.properties
          echo "storeFile=my-release-key.jks" >> android/key.properties
        working-directory: .
        shell: bash

      # 6. Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # 7. Create Release on GitHub
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          body: "Automated APK build from GitHub Actions with release signing."